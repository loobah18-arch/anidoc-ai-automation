name: 🎬 Auto 2D Documentary Creation & YouTube Upload

on:
  schedule:
    # Runs daily at 13:30 UTC (off-peak minute to avoid runner queue drops)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Documentary Topic (leave empty to pick automatically from catalog/AI rotation)'
        required: false
        type: string
      language:
        description: 'Narration Language (Hindi / English)'
        required: false
        default: 'Hindi'
        type: string
      privacy:
        description: 'YouTube Privacy Status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

concurrency:
  group: anidoc_daily_pipeline
  cancel-in-progress: false

jobs:
  produce_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu fonts-liberation fonts-noto-cjk fonts-freefont-ttf libass-dev
          fc-cache -f -v

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Video Creation & YouTube Upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --language "${{ github.event.inputs.language }}" --upload --privacy "${{ github.event.inputs.privacy }}"
          else
            python main.py --auto-upload --privacy "${{ github.event.inputs.privacy || 'public' }}"
          fi

      - name: 💾 Commit & Push Updated History and State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add documentary_history.json channel_state.json || true
          git commit -m "chore: update documentary history and state [skip ci]" || echo "No state changes to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} || echo "No rebase needed"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "No push needed"
