name: Auto-Mint YouTube Secret
on:
  workflow_dispatch:

jobs:
  mint_youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Attempt YouTube Token Refresh & Secret Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.parse, subprocess

          client_id = os.environ.get('CLIENT_ID')
          client_secret = os.environ.get('CLIENT_SECRET')
          refresh_token = os.environ.get('GDRIVE_REFRESH_TOKEN') or os.environ.get('REFRESH_TOKEN')

          print(f'Testing OAuth refresh with client_id ending in ...{client_id[-6:] if client_id else \"NONE\"}')

          data = urllib.parse.urlencode({
              'client_id': client_id,
              'client_secret': client_secret,
              'refresh_token': refresh_token,
              'grant_type': 'refresh_token',
          }).encode()

          req = urllib.request.Request('https://oauth2.googleapis.com/token', data=data)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  res = json.load(resp)
                  access_token = res.get('access_token')
                  scopes = res.get('scope', '')
                  print(f'✅ Token Exchange Result: HTTP 200 OK')
                  print(f'   Scopes granted: {scopes}')
                  
                  if 'youtube' in scopes.lower():
                      print('🎉 Token has YouTube scope! Updating YOUTUBE_* secrets...')
                      # Update YOUTUBE_* secrets via gh
                      subprocess.run(['gh', 'secret', 'set', 'YOUTUBE_CLIENT_ID', '--body', client_id], check=True)
                      subprocess.run(['gh', 'secret', 'set', 'YOUTUBE_CLIENT_SECRET', '--body', client_secret], check=True)
                      subprocess.run(['gh', 'secret', 'set', 'YOUTUBE_REFRESH_TOKEN', '--body', refresh_token], check=True)
                      print('✅ YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN updated!')
                  else:
                      print('⚠️ Token response lacks youtube scope. Interactive user consent required.')
          except Exception as e:
              print(f'❌ Token Exchange Failed: {e}')
          "
