name: Anime Shorts Pipeline (conversation Shorts only, protected uploads)

on:
  push:
    branches: [narrator-edit]
    paths: ['edit/pipeline.py', 'publish.py', 'preflight_gate.py', '.github/workflows/shorts_pipeline.yml']
  schedule:
    - cron: '0 */2 * * *'          # Runs every 2 hours; pre-flight sleeps inline up to 2.5h to hit the exact 24h upload mark
  workflow_dispatch:
    inputs:
      style:
        description: 'convo (default; auto = convo) or narrated (old style, only when forced)'
        required: false
        default: 'convo'
      pick:
        description: 'auto, an anime name, or a character'
        required: false
        default: 'auto'
      upload:
        description: 'upload to YouTube (protection layers still apply)'
        required: false
        default: 'false'
      from_timer:
        description: 'Internal: dispatched by exact_due_timer (keeps 24h preflight active)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  preflight_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      remaining_seconds: ${{ steps.gate.outputs.remaining_seconds }}
      due_at: ${{ steps.gate.outputs.due_at }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Layer 0 pre-flight (24 h spacing, skip render if too soon)
        env:
          PREFLIGHT_BYPASS: ${{ github.event_name != 'schedule' && !inputs.from_timer && 'true' || '' }}
        run: python3 preflight_gate.py

  exact_due_timer:
    name: Trigger Pipeline Exactly When 24h Is Up
    needs: preflight_gate
    if: needs.preflight_gate.outputs.proceed == 'false' && needs.preflight_gate.outputs.remaining_seconds != '' && fromJSON(needs.preflight_gate.outputs.remaining_seconds) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
    concurrency:
      group: anidoc-exact-due-timer
      cancel-in-progress: true
    steps:
      - name: Sleep until due (${{ needs.preflight_gate.outputs.due_at }})
        run: |
          REM=${{ needs.preflight_gate.outputs.remaining_seconds }}
          WAIT=$(( REM + 60 ))
          MAX_SLEEP=20400
          if [ "$WAIT" -gt "$MAX_SLEEP" ]; then
            echo "Remaining wait (${WAIT}s) exceeds 5.6h runner cap. Sleeping ${MAX_SLEEP}s then chaining..."
            sleep "$MAX_SLEEP"
          else
            echo "Sleeping ${WAIT}s until ${{ needs.preflight_gate.outputs.due_at }} (+60s margin)..."
            [ "$WAIT" -gt 0 ] && sleep "$WAIT" || true
          fi
      - name: Dispatch the pipeline now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run shorts_pipeline.yml \
            --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f style=convo -f pick=auto -f upload=true -f from_timer=true

  render:
    needs: preflight_gate
    if: needs.preflight_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 170
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 python3-pip git ca-certificates libsndfile1 libglib2.0-0t64 fonts-montserrat fontconfig
          pip3 install --break-system-packages gdown numpy librosa soundfile scikit-learn faster-whisper "opencv-python-headless<5" edge-tts requests google-api-python-client google-auth
          pip3 install --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1
          pip3 install --break-system-packages demucs open_clip_torch pillow
      - uses: actions/checkout@v4
      - name: Restore character reference pictures + CLIP weights
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            edit/work/refs
            /github/home/.cache/huggingface
          key: charvis-refs-v1-${{ github.run_id }}
          restore-keys: |
            charvis-refs-v1-
      - name: Make the Short (conversation AMV edit only)
        env:
          STYLE: ${{ github.event.inputs.style || 'convo' }}
          PICK: ${{ github.event.inputs.pick || 'auto' }}
          DRIVE_FOLDER: 1e5_IF3GRHNr315hP5zK_qlyfsKXm3Ox4
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIGHT_VISION: '0'
        run: python3 edit/pipeline.py
      - name: Quality gate (duration, repeats, captions, loudness, character)
        id: gate
        run: python3 edit/gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/meta.json
            out/gate.json
          retention-days: 30
      - name: Upload with protection layers (0 spacing, 1 momentum, 2 velocity, block retry)
        if: (github.event_name == 'schedule' || github.event.inputs.upload == 'true') && steps.gate.outputs.gate == 'pass'
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.CLIENT_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: python3 publish.py
      - name: Save history and gate state
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "amv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edit/history.json edit/research_cache.json edit/fight_windows.json metadata/youtube_upload_history.json metadata/candle_gate_state.json 2>/dev/null || true
          git commit -m "history: anime short ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
