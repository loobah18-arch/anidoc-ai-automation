name: Verify Event Timestamps

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Specific event_id to verify (optional — empty = ALL unverified events)'
        required: false
        default: ''
        type: string

jobs:
  verify_events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: fix/title-and-clip-selection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract Sample Frames From Every Event Window
        env:
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
          EVENT_ID_INPUT: ${{ github.event.inputs.event_id }}
        run: |
          if [ -n "$EVENT_ID_INPUT" ]; then
            python scripts/verify_event_windows.py --event-id "$EVENT_ID_INPUT"
          else
            python scripts/verify_event_windows.py
          fi

      - name: Upload Verification Frames Artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-verification-frames
          path: scratch/event_verification/
          retention-days: 14
