name: Daily 4K Phonk / Scene Edit Generator & YouTube + TikTok Auto-Upload

on:
  schedule:
    - cron: '30 6,18 * * *'  # Runs twice daily at 06:30 UTC & 18:30 UTC
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe (marvel, jjk, or random)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'marvel'
          - 'jjk'
      character:
        description: 'Specific character (spiderman, gojo, sukuna, ironman, thor, toji, wolverine, loki, megumi, yuji)'
        required: false
        default: ''
        type: string
      phonk:
        description: 'Phonk BGM Track (or random for auto-rotation)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'brazilian_phonk_montagem'
          - 'tokyo_drift_phonk'
          - 'dark_shadow_phonk'
          - 'cyber_phonk_beat'
          - 'gigachad_phonk'
      subtitle_style:
        description: 'Kinetic Subtitle Style Preset'
        required: false
        default: 'viral_karaoke'
        type: choice
        options:
          - 'viral_karaoke'
          - 'cyber_glow'
          - 'anime_shrine'
          - 'cinematic_minimal'
      refresh_clips:
        description: 'Download & slice fresh scenepack cuts (multi-source: yt-dlp → Archive.org → Pixabay)'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload rendered Short to YouTube'
        required: true
        default: true
        type: boolean
      upload_tiktok:
        description: 'Also upload to TikTok (requires TIKTOK_COOKIES_JSON secret)'
        required: false
        default: false
        type: boolean

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Fonts, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python test_pipeline.py

      - name: Generate 4K Phonk Scene Edit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # TikTok dual-upload: base64 encode your TikTok cookies JSON and store as TIKTOK_COOKIES_JSON secret
          # Generate locally with: base64 < CookiesDir/your_username.json | pbcopy
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          # Optional stock video APIs (free at pixabay.com & pexels.com)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          CMD="python main.py --duration 22.0"
          
          if [ "${{ github.event.inputs.universe }}" != "random" ] && [ -n "${{ github.event.inputs.universe }}" ]; then
            CMD="$CMD --universe ${{ github.event.inputs.universe }}"
          fi
          
          if [ -n "${{ github.event.inputs.character }}" ]; then
            CMD="$CMD --character ${{ github.event.inputs.character }}"
          fi
          
          if [ "${{ github.event.inputs.phonk }}" != "random" ] && [ -n "${{ github.event.inputs.phonk }}" ]; then
            CMD="$CMD --phonk ${{ github.event.inputs.phonk }}"
          fi
          
          if [ -n "${{ github.event.inputs.subtitle_style }}" ]; then
            CMD="$CMD --subtitle-style ${{ github.event.inputs.subtitle_style }}"
          fi
          
          # Always refresh clips to get diverse sources each run
          CMD="$CMD --refresh-clips"
          
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.upload }}" = "true" ]; then
            CMD="$CMD --upload"
          fi
          
          if [ "${{ github.event.inputs.upload_tiktok }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            CMD="$CMD --upload-tiktok"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4k-phonk-edits
          path: |
            output/*.mp4
            scratch/*.ass
          retention-days: 7
