name: Daily 4K Phonk / Scene Edit Generator & YouTube Auto-Upload

on:
  schedule:
    - cron: '30 6 * * *'   # Morning Slot (06:30 UTC): Daily Demon Slayer 4K Short
    - cron: '30 18 * * *'  # Evening Slot (18:30 UTC): Daily Jujutsu Kaisen 4K Short
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe (demonslayer, jjk, marvel, or random)'
        required: false
        default: 'demonslayer'
        type: choice
        options:
          - 'demonslayer'
          - 'jjk'
          - 'random'
          - 'marvel'
      character:
        description: 'Specific character (tanjiro, rengoku, zenitsu, akaza, giyu, tengen, inosuke, muzan, nezuko, muichiro, gyutaro, gojo, sukuna, yuji, toji, megumi)'
        required: false
        default: ''
        type: string
      phonk:
        description: 'Phonk BGM Track (or random for auto-rotation)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'lonown_avangard_phonk'
          - 'mvsterious_slava_funk'
          - 'dygo_funk_infernal'
          - 'ashreveal_manasha_phonk'
          - 'andromeda_no_fear_phonk'
          - 'ogryzek_aura_phonk'
          - 'ncts_next_phonk'
          - 'nxght_blue_horizon_funk'
          - 'trashxrl_deus_do_olimpo'
          - 'irokz_funk_universo_slowed'
      gdrive_folder:
        description: 'Google Drive folder link or ID containing raw movies/episodes (optional)'
        required: false
        default: ''
        type: string
      refresh_clips:
        description: 'Download & slice fresh scenepack cuts (multi-source: yt-dlp → Archive.org → Pixabay)'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload rendered Short to YouTube (disabled by default on feature branches)'
        required: false
        default: false
        type: boolean

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Fonts, yt-dlp, Unpackers)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig p7zip-full unrar-free
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python test_pipeline.py

      - name: Generate 4K Phonk Scene Edit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.CLIENT_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # Optional stock video APIs (free at pixabay.com & pexels.com)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          CMD="python main.py --duration 60.0"



          # Scheduled runs: Upload both anime edits once per day at different times on the same day.
          # Morning Slot (06:30 UTC): Demon Slayer daily edit for @jazzcreates
          # Evening Slot (18:30 UTC): Jujutsu Kaisen daily edit for @jazzcreates
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt 12 ]; then
              echo "🌅 [Scheduled Run: Morning Slot] Generating & Uploading Demon Slayer 4K Edit to @jazzcreates..."
              CMD="$CMD --universe demonslayer"
            else
              echo "🌆 [Scheduled Run: Evening Slot] Generating & Uploading Jujutsu Kaisen 4K Edit to @jazzcreates..."
              CMD="$CMD --universe jjk"
            fi
          elif [ "${{ github.event.inputs.universe }}" = "random" ]; then
            CHOSEN_UNI=$(python3 -c "import random; print(random.choice(['demonslayer', 'jjk']))")
            echo "🎲 [Random Universe] Selected: $CHOSEN_UNI"
            CMD="$CMD --universe $CHOSEN_UNI"
          elif [ -n "${{ github.event.inputs.universe }}" ]; then
            CMD="$CMD --universe ${{ github.event.inputs.universe }}"
          else
            CMD="$CMD --universe demonslayer"
          fi
          
          if [ -n "${{ github.event.inputs.character }}" ]; then
            CMD="$CMD --character ${{ github.event.inputs.character }}"
          fi
          
          if [ "${{ github.event.inputs.phonk }}" != "random" ] && [ -n "${{ github.event.inputs.phonk }}" ]; then
            CMD="$CMD --phonk ${{ github.event.inputs.phonk }}"
          fi
          
          if [ -n "${{ github.event.inputs.gdrive_folder }}" ]; then
            CMD="$CMD --gdrive-folder '${{ github.event.inputs.gdrive_folder }}'"
          fi
          
          # Always refresh clips to get diverse sources each run
          CMD="$CMD --refresh-clips"
          
          # During testing, uploads are disabled by default (default: false).
          # Upload only occurs if explicitly enabled via input (upload == 'true'),
          # or on scheduled daily runs on the main branch.
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then
            echo "🚀 [Publish] Manual YouTube upload requested."
            CMD="$CMD --upload"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "🚀 [Publish] Scheduled daily upload on main."
            CMD="$CMD --upload"
          else
            echo "🔒 [Testing Mode] Skipping YouTube upload for this run (upload disabled by default while testing)."
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4k-phonk-edits
          path: |
            output/*.mp4
          retention-days: 7
