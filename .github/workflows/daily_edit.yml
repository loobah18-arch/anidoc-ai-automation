name: Daily 4K Phonk / Scene Edit Generator & YouTube Auto-Upload

on:
  schedule:
    - cron: '30 6,18 * * *'  # Runs twice daily at 06:30 UTC & 18:30 UTC
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe (marvel, jjk, or random)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'marvel'
          - 'jjk'
      character:
        description: 'Specific character (spiderman, gojo, sukuna, ironman, thor, toji, wolverine, loki, megumi, yuji)'
        required: false
        default: ''
        type: string
      phonk:
        description: 'Phonk BGM Track (or random for auto-rotation)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'lonown_avangard_phonk'
          - 'mvsterious_slava_funk'
          - 'dygo_funk_infernal'
          - 'ashreveal_manasha_phonk'
          - 'andromeda_no_fear_phonk'
          - 'ogryzek_aura_phonk'
          - 'ncts_next_phonk'
          - 'nxght_blue_horizon_funk'
          - 'trashxrl_deus_do_olimpo'
          - 'irokz_funk_universo_slowed'
      subtitle_style:
        description: 'Kinetic Subtitle Style Preset'
        required: false
        default: 'viral_karaoke'
        type: choice
        options:
          - 'viral_karaoke'
          - 'cyber_glow'
          - 'anime_shrine'
          - 'cinematic_minimal'
      gdrive_folder:
        description: 'Google Drive folder link or ID containing raw movies/episodes (optional)'
        required: false
        default: ''
        type: string
      refresh_clips:
        description: 'Download & slice fresh scenepack cuts (multi-source: yt-dlp → Archive.org → Pixabay)'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload rendered Short to YouTube'
        required: false
        default: false
        type: boolean
      audit:
        description: 'Run post-render quality audit vs priority reference (@Chakra_boy)'
        required: false
        default: true
        type: boolean

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Fonts, yt-dlp, Unpackers)
        run: |
          sudo apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig p7zip-full unrar-free || true
          sudo wget -q --timeout=30 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp || true
          sudo chmod a+rx /usr/local/bin/yt-dlp || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python test_pipeline.py

      - name: Generate 4K Phonk Scene Edit
        env:
          PYTHONUNBUFFERED: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # Optional stock video APIs (free at pixabay.com & pexels.com)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          CMD="python main.py --duration 38.0"
          
          if [ "${{ github.event.inputs.universe }}" != "random" ] && [ -n "${{ github.event.inputs.universe }}" ]; then
            CMD="$CMD --universe ${{ github.event.inputs.universe }}"
          fi
          
          if [ -n "${{ github.event.inputs.character }}" ]; then
            CMD="$CMD --character ${{ github.event.inputs.character }}"
          fi
          
          if [ "${{ github.event.inputs.phonk }}" != "random" ] && [ -n "${{ github.event.inputs.phonk }}" ]; then
            CMD="$CMD --phonk ${{ github.event.inputs.phonk }}"
          fi
          
          if [ -n "${{ github.event.inputs.subtitle_style }}" ]; then
            CMD="$CMD --subtitle-style ${{ github.event.inputs.subtitle_style }}"
          fi

          if [ -n "${{ github.event.inputs.gdrive_folder }}" ]; then
            CMD="$CMD --gdrive-folder '${{ github.event.inputs.gdrive_folder }}'"
          fi
          
          # Always refresh clips to get diverse sources each run
          CMD="$CMD --refresh-clips"
          
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then
            CMD="$CMD --upload"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Send Output Video & Code Snapshot Bundle to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            RUN_ID="${{ github.run_id }}"
            COMMIT_SHA="${{ github.sha }}"
            SHORT_SHA="${COMMIT_SHA:0:7}"
            BUNDLE_NAME="code_snapshot_run_${RUN_ID}_${SHORT_SHA}.zip"

            # Create code snapshot bundle archive
            git log -1 --stat > run_${RUN_ID}_commit.txt || true
            git diff HEAD~1 > run_${RUN_ID}_patch.diff || true
            zip -q -r "$BUNDLE_NAME" core/ config/ scripts/ .github/ run_${RUN_ID}_commit.txt run_${RUN_ID}_patch.diff -x "*.pyc" "*/__pycache__/*"

            for vid in output/*.mp4; do
              if [ -f "$vid" ]; then
                echo "🚀 Sending $vid to Telegram Chat ($TELEGRAM_CHAT_ID)..."

                # Telegram Bot API hard limit: 50MB. Compress to fit if oversized.
                SIZE_MB=$(du -m "$vid" | cut -f1)
                SEND_FILE="$vid"
                if [ "$SIZE_MB" -gt 48 ]; then
                  echo "⚠️ Video is ${SIZE_MB}MB (>50MB Telegram limit). Re-encoding to fit under 48MB..."
                  DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$vid")
                  # Target total bitrate: (47MB * 8192 kbit) / duration, split 90% video / 10% audio
                  TOTAL_KBPS=$(python3 -c "print(int(47*8192/float('${DUR}')))")
                  VBITRATE=$(python3 -c "print(max(1200, int(${TOTAL_KBPS}*0.9)))")
                  ABITRATE=$(python3 -c "print(min(192, max(96, int(${TOTAL_KBPS}*0.1))))")
                  COMPRESSED="telegram_${vid##*/}"
                  ffmpeg -y -i "$vid" -c:v libx264 -preset medium -b:v "${VBITRATE}k" -maxrate "${VBITRATE}k" -bufsize "$((VBITRATE*2))k" \
                    -pix_fmt yuv420p -c:a aac -b:a "${ABITRATE}k" -movflags +faststart "$COMPRESSED"
                  SEND_FILE="$COMPRESSED"
                  echo "✅ Compressed to $(du -m "$SEND_FILE" | cut -f1)MB (${VBITRATE}k video / ${ABITRATE}k audio)"
                fi

                # Send as streaming video (sendVideo keeps it playable inline in Telegram)
                RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                  -F "chat_id=${TELEGRAM_CHAT_ID}" \
                  -F "video=@${SEND_FILE}" \
                  -F "supports_streaming=true" \
                  -F "caption=🎬 4K 60FPS Cloud Edit Rendered! 🚀%0AGit Commit: ${SHORT_SHA} (Run #${RUN_ID})")

                # Fallback to document if sendVideo still fails
                if echo "$RESP" | grep -q '"ok":false'; then
                  echo "⚠️ sendVideo failed. Sending as Document..."
                  curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${TELEGRAM_CHAT_ID}" \
                    -F "document=@${SEND_FILE}" \
                    -F "caption=🎬 4K 60FPS Video File (Run #${RUN_ID} / Commit ${SHORT_SHA})" || true
                fi

                # Cleanup compressed temp file
                rm -f "$SEND_FILE" 2>/dev/null || true
              fi
            done

            if [ -f "$BUNDLE_NAME" ]; then
              echo "📦 Sending Code Snapshot Bundle $BUNDLE_NAME to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${BUNDLE_NAME}" \
                -F "caption=📦 Code Snapshot Archive (Run #${RUN_ID} / Commit ${SHORT_SHA}). Send me this ZIP anytime to revert code!" || true
            fi
          fi

      - name: Upload Video & Code Snapshot to Google Drive
        if: always()
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
        run: |
          RUN_ID="${{ github.run_id }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_DATE=$(date -u +%Y-%m-%d)
          RUN_LABEL="Run_${RUN_ID}_${RUN_DATE}_${SHORT_SHA}"
          BUNDLE_NAME="code_snapshot_run_${RUN_ID}_${SHORT_SHA}.zip"

          # Rebuild snapshot zip if the Telegram step didn't create it (secrets may be absent)
          if [ ! -f "$BUNDLE_NAME" ]; then
            git log -1 --stat > run_${RUN_ID}_commit.txt || true
            git diff HEAD~1 > run_${RUN_ID}_patch.diff || true
            zip -q -r "$BUNDLE_NAME" core/ config/ scripts/ .github/ run_${RUN_ID}_commit.txt run_${RUN_ID}_patch.diff -x "*.pyc" "*/__pycache__/*"
          fi

          FILES=""
          for vid in output/*.mp4; do
            [ -f "$vid" ] && FILES="$FILES $vid"
          done
          FILES="$FILES $BUNDLE_NAME"

          if [ -z "$GDRIVE_FOLDER_URL" ]; then
            echo "⚠️ GDRIVE_FOLDER_URL not set; skipping Google Drive upload."
            exit 0
          fi

          echo "☁️ Uploading to Google Drive folder: Run_${RUN_ID}_${RUN_DATE}_${SHORT_SHA}"
          python3 scripts/upload_to_gdrive.py $FILES --label "$RUN_LABEL"

      - name: Quality Audit vs Priority Reference
        if: ${{ github.event.inputs.audit == 'true' }}
        run: |
          mkdir -p audit/frames
          RENDERED=$(ls output/*.mp4 | head -1)
          echo "Auditing: $RENDERED"

          # Extract 10 keyframes from rendered video
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RENDERED")
          for i in $(seq 1 10); do
            T=$(python3 -c "print(round($DUR * $i / 11.0, 2))")
            ffmpeg -y -ss "$T" -i "$RENDERED" -frames:v 1 -q:v 2 "audit/frames/rendered_$(printf '%02d' $i).png" 2>/dev/null || true
          done

          # Copy bundled priority reference keyframes for side-by-side delivery
          cp references/priority_ref/*.png audit/frames/ 2>/dev/null || true

          # Compute comparison metrics against committed ground-truth reference
          python3 - <<'EOF'
          import json, subprocess, os

          def probe(path):
              out = subprocess.run(["ffprobe","-v","error","-show_entries",
                  "format=duration:stream=width,height,r_frame_rate",
                  "-of","json",path],capture_output=True,text=True)
              return json.loads(out.stdout)

          def scene_cuts(path):
              r = subprocess.run(["ffmpeg","-i",path,"-filter_complex",
                  "select='gt(scene,0.35)',metadata=print","-f","null","-"],
                  capture_output=True,text=True)
              ts=[]
              for l in r.stderr.splitlines():
                  if "pts_time" in l:
                      import re as _re
                      m=_re.search(r"pts_time:([\d.]+)",l)
                      if m: ts.append(round(float(m.group(1)),2))
              scene_cuts.last_ts=ts
              return len(ts)

          def signal_stats(path):
              r = subprocess.run(["ffmpeg","-i",path,"-vf",
                  "signalstats,metadata=print","-f","null","-"],
                  capture_output=True,text=True)
              yavg=sat=n=0; ymin=255.0; ymax=0.0
              for l in r.stderr.splitlines():
                  if "lavfi.signalstats.YAVG=" in l:
                      yavg+=float(l.split("YAVG=")[1].strip()); n+=1
                  elif "lavfi.signalstats.SATAVG=" in l:
                      sat+=float(l.split("SATAVG=")[1].strip())
                  elif "lavfi.signalstats.YMIN=" in l:
                      ymin=min(ymin,float(l.split("YMIN=")[1].strip()))
                  elif "lavfi.signalstats.YMAX=" in l:
                      ymax=max(ymax,float(l.split("YMAX=")[1].strip()))
              return {"yavg":round(yavg/max(n,1),1),"saturation":round(sat/max(n,1),1),
                      "dynamic_range":round(ymax-ymin,1)}

          rendered = sorted(__import__("glob").glob("output/*.mp4"))[0]
          with open("references/priority_metrics.json") as f:
              pr = json.load(f)

          p = probe(rendered)
          n_cuts = scene_cuts(rendered)
          rd = {
              "file": os.path.basename(rendered),
              "duration": round(float(p["format"]["duration"]),2),
              "resolution": f'{p["streams"][0]["width"]}x{p["streams"][0]["height"]}',
              "fps": p["streams"][0].get("r_frame_rate"),
              "scene_cuts": n_cuts,
              "cut_timestamps": scene_cuts.last_ts[:60],
              **signal_stats(rendered)
          }

          dur_scale = rd["duration"]/max(pr["duration"],0.1)
          scaled_cuts = round(pr["scene_cuts"]*dur_scale)
          report = {
              "rendered": rd,
              "priority_reference": pr,
              "gap_analysis": {
                  "cut_count_rendered_vs_scaled_ref": [rd["scene_cuts"], scaled_cuts],
                  "cut_delta": rd["scene_cuts"]-scaled_cuts,
                  "saturation_delta": round(rd["saturation"]-pr["saturation"],1),
                  "brightness_delta": round(rd["yavg"]-pr["yavg"],1),
                  "dynamic_range_delta": round(rd["dynamic_range"]-(pr.get("yavg",100)*0+255),1) if False else None,
                  "verdict_cut_pacing": "MATCH" if abs(rd["scene_cuts"]-scaled_cuts)<=max(3,scaled_cuts*0.25) else "ADJUST",
                  "verdict_color": "MATCH" if abs(rd["saturation"]-pr["saturation"])<8 else "ADJUST",
                  "verdict_brightness": "MATCH" if abs(rd["yavg"]-pr["yavg"])<12 else "ADJUST"
              }
          }
          report["gap_analysis"].pop("dynamic_range_delta",None)
          with open("audit/eval_report.json","w") as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          EOF

      - name: Send Audit Report & Frames to Telegram
        if: ${{ always() && github.event.inputs.audit == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f audit/eval_report.json ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@audit/eval_report.json" \
              -F "caption=📊 Quality Audit Report (Run #${{ github.run_id }})" || true
            zip -q -r audit_frames_run_${{ github.run_id }}.zip audit/frames/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@audit_frames_run_${{ github.run_id }}.zip" \
              -F "caption=🖼️ Keyframes: rendered vs priority_ref vs secondary_ref (Run #${{ github.run_id }})" || true
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4k-phonk-edits
          path: |
            output/*.mp4
            scratch/*.ass
            audit/eval_report.json
            audit/frames/*.png
          retention-days: 7

