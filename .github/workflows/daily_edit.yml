name: Daily 4K Phonk / Scene Edit Generator & YouTube Auto-Upload

on:
  schedule:
    - cron: '30 6,18 * * *'  # Runs twice daily at 06:30 UTC & 18:30 UTC
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe (marvel, jjk, or random)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'marvel'
          - 'jjk'
      character:
        description: 'Specific character (spiderman, gojo, sukuna, ironman, thor, toji, wolverine, loki, megumi, yuji)'
        required: false
        default: ''
        type: string
      phonk:
        description: 'Phonk BGM Track (or random for auto-rotation)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'lonown_avangard_phonk'
          - 'mvsterious_slava_funk'
          - 'dygo_funk_infernal'
          - 'ashreveal_manasha_phonk'
          - 'andromeda_no_fear_phonk'
          - 'ogryzek_aura_phonk'
          - 'ncts_next_phonk'
          - 'nxght_blue_horizon_funk'
          - 'trashxrl_deus_do_olimpo'
          - 'irokz_funk_universo_slowed'
      subtitle_style:
        description: 'Kinetic Subtitle Style Preset'
        required: false
        default: 'viral_karaoke'
        type: choice
        options:
          - 'viral_karaoke'
          - 'cyber_glow'
          - 'anime_shrine'
          - 'cinematic_minimal'
      gdrive_folder:
        description: 'Google Drive folder link or ID containing raw movies/episodes (optional)'
        required: false
        default: ''
        type: string
      refresh_clips:
        description: 'Download & slice fresh scenepack cuts (multi-source: yt-dlp → Archive.org → Pixabay)'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload rendered Short to YouTube'
        required: false
        default: false
        type: boolean

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Fonts, yt-dlp, Unpackers)
        run: |
          sudo apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig p7zip-full unrar-free || true
          sudo wget -q --timeout=30 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp || true
          sudo chmod a+rx /usr/local/bin/yt-dlp || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python test_pipeline.py

      - name: Generate 4K Phonk Scene Edit
        env:
          PYTHONUNBUFFERED: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # Optional stock video APIs (free at pixabay.com & pexels.com)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          CMD="python main.py --duration 38.0"
          
          if [ "${{ github.event.inputs.universe }}" != "random" ] && [ -n "${{ github.event.inputs.universe }}" ]; then
            CMD="$CMD --universe ${{ github.event.inputs.universe }}"
          fi
          
          if [ -n "${{ github.event.inputs.character }}" ]; then
            CMD="$CMD --character ${{ github.event.inputs.character }}"
          fi
          
          if [ "${{ github.event.inputs.phonk }}" != "random" ] && [ -n "${{ github.event.inputs.phonk }}" ]; then
            CMD="$CMD --phonk ${{ github.event.inputs.phonk }}"
          fi
          
          if [ -n "${{ github.event.inputs.subtitle_style }}" ]; then
            CMD="$CMD --subtitle-style ${{ github.event.inputs.subtitle_style }}"
          fi

          if [ -n "${{ github.event.inputs.gdrive_folder }}" ]; then
            CMD="$CMD --gdrive-folder '${{ github.event.inputs.gdrive_folder }}'"
          fi
          
          # Always refresh clips to get diverse sources each run
          CMD="$CMD --refresh-clips"
          
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then
            CMD="$CMD --upload"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Send Output Video & Code Snapshot Bundle to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            RUN_ID="${{ github.run_id }}"
            COMMIT_SHA="${{ github.sha }}"
            SHORT_SHA="${COMMIT_SHA:0:7}"
            BUNDLE_NAME="code_snapshot_run_${RUN_ID}_${SHORT_SHA}.zip"

            # Create code snapshot bundle archive
            git log -1 --stat > run_${RUN_ID}_commit.txt || true
            git diff HEAD~1 > run_${RUN_ID}_patch.diff || true
            zip -q -r "$BUNDLE_NAME" core/ config/ scripts/ .github/ run_${RUN_ID}_commit.txt run_${RUN_ID}_patch.diff -x "*.pyc" "*/__pycache__/*"

            for vid in output/*.mp4; do
              if [ -f "$vid" ]; then
                echo "🚀 Sending $vid to Telegram Chat ($TELEGRAM_CHAT_ID)..."
                
                # First try sendVideo
                RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                  -F "chat_id=${TELEGRAM_CHAT_ID}" \
                  -F "video=@${vid}" \
                  -F "caption=🎬 4K 60FPS Cloud Edit Rendered! 🚀%0AGit Commit: ${SHORT_SHA} (Run #${RUN_ID})")
                
                # If sendVideo fails (e.g. file > 50MB), send as document (supports up to 2GB!)
                if echo "$RESP" | grep -q '"ok":false'; then
                  echo "⚠️ sendVideo returned error (likely >50MB). Sending as Document (up to 2GB)..."
                  curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${TELEGRAM_CHAT_ID}" \
                    -F "document=@${vid}" \
                    -F "caption=🎬 4K 60FPS Video File (Run #${RUN_ID} / Commit ${SHORT_SHA})" || true
                fi
              fi
            done

            if [ -f "$BUNDLE_NAME" ]; then
              echo "📦 Sending Code Snapshot Bundle $BUNDLE_NAME to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${BUNDLE_NAME}" \
                -F "caption=📦 Code Snapshot Archive (Run #${RUN_ID} / Commit ${SHORT_SHA}). Send me this ZIP anytime to revert code!" || true
            fi
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4k-phonk-edits
          path: |
            output/*.mp4
            scratch/*.ass
          retention-days: 7

