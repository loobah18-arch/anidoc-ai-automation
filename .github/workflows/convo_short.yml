name: Convo Short (conversation + captions, then the edit)

on:
  push:
    branches: [convo-edit]
    paths: ['edit/convo.py', 'edit/auto.py', 'edit/drive_index.py', 'edit/pro_fx.py', '.github/workflows/convo_short.yml']
  workflow_dispatch:
    inputs:
      pick:
        description: 'auto (newest/least-used anime in Drive), an anime name (e.g. demon slayer), or a character (gojo, sukuna, yuji, toji, megumi)'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: convo-short
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 150
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 python3-pip git ca-certificates libsndfile1 libglib2.0-0t64 fonts-montserrat fontconfig
          fc-list | grep -i "montserrat" | grep -i "extrabold" | head -2
          pip3 install --break-system-packages gdown numpy librosa soundfile scikit-learn faster-whisper "opencv-python-headless<5" requests
          pip3 install --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1
          pip3 install --break-system-packages demucs open_clip_torch pillow
      - uses: actions/checkout@v4
      - name: Make the Short
        env:
          PICK: ${{ github.event.inputs.pick || 'auto' }}
          DRIVE_FOLDER: 1e5_IF3GRHNr315hP5zK_qlyfsKXm3Ox4
        run: python3 edit/convo.py
      - uses: actions/upload-artifact@v4
        with:
          name: convo-short-${{ github.run_number }}
          path: |
            out/*.mp4
            edit/work/convo/convo.json
            edit/work/convo/captions.ass
          retention-days: 30
      - name: Remember what was used
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "amv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edit/history.json edit/research_cache.json edit/fight_windows.json 2>/dev/null || git add edit/history.json
          git commit -m "history + research cache: convo short ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
